version: 1
disable_existing_loggers: false
formatters:
  default:
    (): "uvicorn.logging.DefaultFormatter"
    fmt: "%(levelprefix)s %(asctime)s - %(message)s"
    use_colors: false
handlers:
  file:
    class: logging.FileHandler
    formatter: default
    filename: uvicorn.log
root:
  level: INFO
  handlers:
    - file
